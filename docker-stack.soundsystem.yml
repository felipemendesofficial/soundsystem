version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soundsystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soundsystem
      TZ: America/Sao_Paulo
    volumes:
      - soundsystem_pgdata:/var/lib/postgresql/data
    networks:
      - soundsystem_internal

  app:
    image: soundsystem_app:latest
    environment:
      DATABASE_URL: postgres://soundsystem:${POSTGRES_PASSWORD}@db:5432/soundsystem?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://soundsystem.felipemendesoficial.cloud
      TZ: America/Sao_Paulo
    networks:
      - soundsystem_internal
      - network_public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.soundsystem.rule=Host(`soundsystem.felipemendesoficial.cloud`)"
        - "traefik.http.routers.soundsystem.entrypoints=websecure"
        - "traefik.http.routers.soundsystem.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.soundsystem.loadbalancer.server.port=3000"

networks:
  soundsystem_internal:
    driver: overlay
  network_public:
    external: true

volumes:
  soundsystem_pgdata:
